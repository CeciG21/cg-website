<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">Delivery Lens dashboard preview</title>
<desc id="desc">Illustrative dark analytics dashboard showing planning baseline, scope movement, AI briefing and release evidence.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#09121a"/><stop offset="1" stop-color="#0d1821"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13212b"/><stop offset="1" stop-color="#101921"/></linearGradient>
  <linearGradient id="brief" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123239"/><stop offset="1" stop-color="#0d262c"/></linearGradient>
  <style>
    .t{font-family:Arial,Helvetica,sans-serif;fill:#eef4f7}.m{font-family:Arial,Helvetica,sans-serif;fill:#8ea0ad}.s{font-family:Arial,Helvetica,sans-serif;fill:#687a86}.c{font-family:Arial,Helvetica,sans-serif;fill:#36d7e8}.g{font-family:Arial,Helvetica,sans-serif;fill:#a6ff66}.b{font-weight:700}.xs{font-size:11px}.sm{font-size:13px}.md{font-size:16px}.lg{font-size:24px}.xl{font-size:34px}.line{stroke:#263944;stroke-width:1}.panel{fill:url(#card);stroke:#2b414e;stroke-width:1.2}.round{rx:14;ry:14}
  </style>
</defs>

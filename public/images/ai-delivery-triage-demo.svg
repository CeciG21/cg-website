<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">AI Delivery Triage Assistant — illustrative interface</title>
<desc id="desc">Fictional delivery triage scenario suggesting a work board and parent feature, pointing out potentially related tasks, and linking to guidance. No real work items or university data.</desc>
